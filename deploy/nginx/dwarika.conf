# Dwarika production Nginx template (hardened for scale)
# 1) Replace example domains
# 2) Copy to /etc/nginx/sites-available/dwarika and enable
# 3) certbot --nginx -d STORE -d ADMIN

limit_req_zone $binary_remote_addr zone=dwarika_api:20m rate=8r/s;
limit_req_zone $binary_remote_addr zone=dwarika_web:20m rate=25r/s;
limit_req_zone $binary_remote_addr zone=dwarika_auth:10m rate=1r/s;
limit_conn_zone $binary_remote_addr zone=dwarika_conn:10m;

upstream dwarika_app {
    server 127.0.0.1:3000;
    keepalive 32;
}

server {
    listen 80;
    server_name your-store.example.com;

    server_tokens off;
    client_max_body_size 1m;
    client_body_timeout 15s;
    client_header_timeout 15s;
    send_timeout 30s;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    location /api/admin-auth {
        limit_req zone=dwarika_auth burst=5 nodelay;
        limit_conn dwarika_conn 20;
        proxy_pass http://dwarika_app;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
        proxy_connect_timeout 5s;
    }

    location /api/customer-auth {
        limit_req zone=dwarika_auth burst=8 nodelay;
        limit_conn dwarika_conn 20;
        proxy_pass http://dwarika_app;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
        proxy_connect_timeout 5s;
    }

    location /api/ {
        limit_req zone=dwarika_api burst=40 nodelay;
        limit_conn dwarika_conn 40;
        proxy_pass http://dwarika_app;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        proxy_connect_timeout 10s;
    }

    location / {
        limit_req zone=dwarika_web burst=60 nodelay;
        limit_conn dwarika_conn 40;
        proxy_pass http://dwarika_app;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

server {
    listen 80;
    server_name admin.your-store.example.com;

    server_tokens off;
    client_max_body_size 1m;
    client_body_timeout 15s;
    client_header_timeout 15s;
    send_timeout 30s;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    location / {
        limit_req zone=dwarika_web burst=40 nodelay;
        limit_conn dwarika_conn 30;
        proxy_pass http://dwarika_app;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
